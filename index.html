<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机车租赁平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1d1d1f; }
  header { background: #1d1d1f; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 20px; }
  header a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.7; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.2s; cursor: pointer; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
  .card-body { padding: 16px; }
  .card-body h3 { font-size: 18px; margin-bottom: 8px; }
  .price { color: #ff3b30; font-weight: bold; font-size: 16px; }
  .desc { color: #666; font-size: 13px; margin-top: 8px; line-height: 1.5; }
  .empty, .loading { text-align: center; padding: 60px 20px; color: #999; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; overflow-y: auto; padding: 20px; }
  .modal.show { display: block; }
  .modal-box { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; position: relative; }
  .close { position: absolute; top: 12px; right: 16px; font-size: 32px; cursor: pointer; color: #fff; text-shadow: 0 0 8px rgba(0,0,0,0.5); z-index: 10; }
  .carousel { position: relative; background: #000; }
  .carousel img, .carousel video { width: 100%; max-height: 450px; object-fit: contain; display: block; }
  .carousel-nav { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .carousel-nav span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; }
  .carousel-nav span.active { background: #fff; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 36px; color: #fff; cursor: pointer; padding: 0 16px; user-select: none; text-shadow: 0 0 8px rgba(0,0,0,0.5); }
  .arrow.left { left: 0; }
  .arrow.right { right: 0; }
  .modal-body { padding: 24px; }
  .modal-body h2 { font-size: 24px; margin-bottom: 12px; }
  .modal-body .price { font-size: 22px; margin-bottom: 16px; }
  .modal-body .desc { font-size: 15px; color: #555; line-height: 1.8; margin-bottom: 24px; }
  .btn { display: block; width: 100%; padding: 14px; background: #1d1d1f; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .btn:hover { background: #333; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .form { margin-top: 24px; display: none; }
  .form input, .form textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .form button { width: 100%; padding: 14px; background: #ff3b30; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .form button:disabled { background: #999; cursor: not-allowed; }
  .msg { padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
  .msg.ok { background: #d4edda; color: #155724; display: block; }
  .msg.err { background: #f8d7da; color: #721c24; display: block; }
  .success-box { text-align: center; padding: 40px 20px; display: none; }
  .success-box .icon { font-size: 64px; margin-bottom: 16px; }
  .success-box h3 { font-size: 22px; margin-bottom: 8px; color: #155724; }
  .success-box p { color: #666; }
</style>
</head>
<body>
<header>
  <h1>🏍️ 机车租赁平台</h1>
  <a href="admin.html">管理员登录</a>
</header>
<div class="container">
  <div id="list" class="grid"></div>
  <div id="loading" class="loading">加载中...</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">×</span>
    <div id="modal-media"></div>
    <div class="modal-body">
      <h2 id="modal-name"></h2>
      <div class="price" id="modal-price"></div>
      <div class="desc" id="modal-desc"></div>

      <div id="formArea">
        <button class="btn" onclick="showForm()">立即租赁</button>
        <div class="form" id="form">
          <input id="cname" placeholder="您的姓名 *">
          <input id="cphone" placeholder="手机号 *">
          <input id="cid" placeholder="身份证号">
          <input id="cstart" type="date">
          <input id="cend" type="date">
          <textarea id="cnote" placeholder="备注"></textarea>
          <button id="submitBtn" onclick="submitBooking()">提交申请</button>
          <div class="msg" id="msg"></div>
        </div>
      </div>

      <div class="success-box" id="successBox">
        <div class="icon">✅</div>
        <h3>提交成功！</h3>
        <p>我们会尽快联系您，请保持电话畅通。</p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = "https://nekzrodpnqyubnmphybd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5la3pyb2RwbnF5dWJubXBoeWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzc2NTgsImV4cCI6MjEwNzIxMzY1OH0.L8MiwWm57boN2HOsunQTf-sWEiqceGGgj7VRbMWcZtY";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentId = null;
let currentImages = [];
let currentVideo = null;
let slideIndex = 0;

async function loadMotorcycles() {
  const { data, error } = await supabase.from('motorcycles').select('*').order('created_at', { ascending: false });
  document.getElementById('loading').style.display = 'none';

  if (error) { document.getElementById('list').innerHTML = '<div class="empty">加载失败：' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { document.getElementById('list').innerHTML = '<div class="empty">暂无车辆，请管理员登录后台添加</div>'; return; }

  document.getElementById('list').innerHTML = data.map(m => {
    const cover = (m.image_urls && m.image_urls[0]) || m.image_url || 'https://via.placeholder.com/400x200?text=No+Image';
    return `
    <div class="card" onclick='openModal(${JSON.stringify(m).replace(/'/g, "&apos;")})'>
      <img src="${cover}" alt="${m.name}">
      <div class="card-body">
        <h3>${m.name}</h3>
        <div class="price">¥${m.price} / 天</div>
        <div class="desc">${(m.description || '').slice(0, 50)}</div>
      </div>
    </div>`;
  }).join('');
}

window.openModal = function(m) {
  currentId = m.id;
  currentImages = m.image_urls && m.image_urls.length ? m.image_urls : (m.image_url ? [m.image_url] : []);
  currentVideo = m.video_url;
  slideIndex = 0;

  document.getElementById('modal-name').textContent = m.name;
  document.getElementById('modal-price').textContent = '¥' + m.price + ' / 天';
  document.getElementById('modal-desc').textContent = m.description || '暂无介绍';

  renderMedia();
  document.getElementById('form').style.display = 'none';
  document.getElementById('formArea').style.display = 'block';
  document.getElementById('successBox').style.display = 'none';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '提交申请';
  document.getElementById('modal').classList.add('show');
};

function renderMedia() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  if (total === 0) {
    document.getElementById('modal-media').innerHTML = '<img src="https://via.placeholder.com/800x450?text=No+Image">';
    return;
  }

  let content = '';
  if (currentVideo && slideIndex === total - 1) {
    content = `<video src="${currentVideo}" controls autoplay></video>`;
  } else {
    content = `<img src="${currentImages[slideIndex]}">`;
  }

  let nav = '';
  if (total > 1) {
    nav = `<div class="carousel-nav">${Array.from({length: total}).map((_, i) =>
      `<span class="${i === slideIndex ? 'active' : ''}" onclick="goSlide(${i})"></span>`).join('')}</div>`;
  }

  let arrows = '';
  if (total > 1) {
    arrows = `<span class="arrow left" onclick="prevSlide()">‹</span>
              <span class="arrow right" onclick="nextSlide()">›</span>`;
  }

  document.getElementById('modal-media').innerHTML = `<div class="carousel">${content}${nav}${arrows}</div>`;
}

window.goSlide = function(i) { slideIndex = i; renderMedia(); };
window.prevSlide = function() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  slideIndex = (slideIndex - 1 + total) % total;
  renderMedia();
};
window.nextSlide = function() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  slideIndex = (slideIndex + 1) % total;
  renderMedia();
};

window.closeModal = function() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal-media').innerHTML = '';
};

window.showForm = function() {
  document.getElementById('form').style.display = 'block';
};

window.submitBooking = async function() {
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const name = document.getElementById('cname').value.trim();
  const phone = document.getElementById('cphone').value.trim();

  if (!name || !phone) { msg.className = 'msg err'; msg.textContent = '姓名和手机号必填'; return; }

  // 防重复提交
  btn.disabled = true;
  btn.textContent = '提交中...';
  msg.className = 'msg'; msg.style.display = 'none';

  const { error } = await supabase.from('bookings').insert({
    motorcycle_id: currentId,
    customer_name: name,
    phone: phone,
    id_card: document.getElementById('cid').value.trim(),
    start_date: document.getElementById('cstart').value || null,
    end_date: document.getElementById('cend').value || null,
    note: document.getElementById('cnote').value.trim()
  });

  if (error) {
    msg.className = 'msg err'; msg.textContent = '提交失败：' + error.message;
    btn.disabled = false;
    btn.textContent = '提交申请';
  } else {
    // 隐藏表单，显示成功提示
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  }
};

loadMotorcycles();
</script>
</body>
</html>
