<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机车租赁平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f12;
    --card: #1a1a1f;
    --card-hover: #22222a;
    --text: #f5f5f7;
    --text-dim: #8e8e93;
    --accent: #ff453a;
    --accent-2: #ff6b5e;
    --border: #2a2a32;
    --success: #30d158;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(255,69,58,0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(90,120,255,0.06) 0%, transparent 40%);
    z-index: -1;
    animation: bgFloat 20s ease-in-out infinite;
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-3%, -3%) scale(1.05); }
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(15,15,18,0.75);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: slideDown 0.5s ease;
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, #ff453a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  header a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.25s;
  }
  header a:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(255,69,58,0.1);
  }

  .hero {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 32px 20px;
    text-align: center;
    animation: fadeUp 0.6s ease 0.1s both;
  }
  .hero h2 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .hero p { color: var(--text-dim); font-size: 16px; }
  @keyframes fadeUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px 80px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    opacity: 0;
    transform: translateY(20px);
    animation: cardIn 0.5s ease forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,69,58,0.5);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,69,58,0.2);
    background: var(--card-hover);
  }
  .card-img-wrap {
    position: relative;
    overflow: hidden;
    height: 220px;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .card:hover img { transform: scale(1.08); }
  .card-img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(26,26,31,0.9) 0%, transparent 50%);
  }
  .card-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #fff;
    z-index: 2;
  }
  .card-body { padding: 20px; position: relative; }
  .card-body h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.3px;
  }
  .card-body .price {
    color: var(--accent);
    font-weight: 700;
    font-size: 20px;
  }
  .card-body .price span { font-size: 13px; color: var(--text-dim); font-weight: 400; }
  .card-body .desc {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 10px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty, .loading {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-dim);
    font-size: 15px;
  }
  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 弹窗 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 200;
    overflow-y: auto;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  .modal.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    max-width: 860px;
    margin: 40px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    animation: modalIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  @keyframes modalIn {
    from { transform: scale(0.92) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 24px;
    line-height: 38px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
    transition: all 0.25s;
    border: none;
  }
  .close:hover { background: var(--accent); transform: rotate(90deg); }

  .carousel { position: relative; background: #000; }
  .carousel img, .carousel video {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    display: block;
  }
  .carousel-nav {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .carousel-nav span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: all 0.3s;
  }
  .carousel-nav span.active {
    background: #fff;
    width: 24px;
    border-radius: 4px;
  }
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 24px;
    line-height: 42px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: all 0.25s;
  }
  .arrow:hover { background: var(--accent); }
  .arrow.left { left: 16px; }
  .arrow.right { right: 16px; }

  .modal-body { padding: 32px; }
  .modal-body h2 { font-size: 26px; margin-bottom: 12px; letter-spacing: -0.5px; }
  .modal-body .price { color: var(--accent); font-size: 24px; font-weight: 700; margin-bottom: 20px; }
  .modal-body .price span { font-size: 14px; color: var(--text-dim); font-weight: 400; }
  .modal-body .desc { font-size: 15px; color: var(--text-dim); line-height: 1.8; margin-bottom: 28px; }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .btn:hover::after { transform: translateX(100%); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,69,58,0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .form { margin-top: 24px; display: none; animation: fadeUp 0.3s ease; }
  .form input, .form textarea {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    transition: all 0.25s;
  }
  .form input:focus, .form textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,69,58,0.15);
  }
  .form input::placeholder, .form textarea::placeholder { color: #555; }
  .form button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }
  .form button:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg {
    padding: 14px;
    border-radius: 10px;
    margin-top: 12px;
    display: none;
    font-size: 14px;
  }
  .msg.ok { background: rgba(48,209,88,0.15); color: var(--success); display: block; border: 1px solid rgba(48,209,88,0.3); }
  .msg.err { background: rgba(255,69,58,0.15); color: var(--accent); display: block; border: 1px solid rgba(255,69,58,0.3); }

  .success-box {
    text-align: center;
    padding: 48px 20px;
    display: none;
    animation: popIn 0.5s cubic-bezier(0.2, 1.5, 0.5, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-box .icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(48,209,88,0.15);
    border: 2px solid var(--success);
    color: var(--success);
    font-size: 44px;
    line-height: 76px;
    margin: 0 auto 20px;
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(48,209,88,0.4); }
    50% { box-shadow: 0 0 0 16px rgba(48,209,88,0); }
  }
  .success-box h3 { font-size: 22px; margin-bottom: 8px; color: var(--success); }
  .success-box p { color: var(--text-dim); }

  @media (max-width: 640px) {
    header { padding: 14px 20px; }
    header h1 { font-size: 18px; }
    .hero { padding: 40px 20px 10px; }
    .container { padding: 16px 20px 60px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .modal-body { padding: 24px 20px; }
  }
</style>
</head>
<body>
<header>
  <h1>🏍️ 机车租赁平台</h1>
  <a href="admin.html">管理员登录</a>
</header>

<div class="hero">
  <h2>找到你的下一台座驾</h2>
  <p>精选机车 · 随时出发 · 即刻租赁</p>
</div>

<div class="container">
  <div id="list" class="grid"></div>
  <div id="loading" class="loading"><div class="spinner"></div><div>加载中...</div></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modal-media"></div>
    <div class="modal-body">
      <h2 id="modal-name"></h2>
      <div class="price" id="modal-price"></div>
      <div class="desc" id="modal-desc"></div>

      <div id="formArea">
        <button class="btn" onclick="showForm()">立即租赁</button>
        <div class="form" id="form">
          <input id="cname" placeholder="您的姓名 *">
          <input id="cphone" placeholder="手机号 *">
          <input id="cid" placeholder="身份证号">
          <input id="cstart" type="date" placeholder="开始日期">
          <input id="cend" type="date" placeholder="结束日期">
          <textarea id="cnote" placeholder="备注" rows="3"></textarea>
          <button id="submitBtn" onclick="submitBooking()">提交申请</button>
          <div class="msg" id="msg"></div>
        </div>
      </div>

      <div class="success-box" id="successBox">
        <div class="icon">✓</div>
        <h3>提交成功！</h3>
        <p>我们会尽快联系您，请保持电话畅通</p>
        <button class="btn" style="margin-top:24px" onclick="closeModal()">知道了</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = "https://nekzrodpnqyubnmphybd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5la3pyb2RwbnF5dWJubXBoeWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzc2NTgsImV4cCI6MjEwNzIxMzY1OH0.L8MiwWm57boN2HOsunQTf-sWEiqceGGgj7VRbMWcZtY";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentId = null;
let currentImages = [];
let currentVideo = null;
let slideIndex = 0;

async function loadMotorcycles() {
  const { data, error } = await supabase.from('motorcycles').select('*').order('created_at', { ascending: false });
  document.getElementById('loading').style.display = 'none';

  if (error) {
    document.getElementById('list').innerHTML = '<div class="empty">加载失败：' + error.message + '</div>';
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('list').innerHTML = '<div class="empty">暂无车辆，请管理员登录后台添加</div>';
    return;
  }

  document.getElementById('list').innerHTML = data.map((m, i) => {
    const cover = (m.image_urls && m.image_urls[0]) || m.image_url || 'https://via.placeholder.com/400x220?text=No+Image';
    const imgCount = m.image_urls ? m.image_urls.length : (m.image_url ? 1 : 0);
    return `
    <div class="card" style="animation-delay:${i * 0.06}s" onclick='openModal(${JSON.stringify(m).replace(/'/g, "&apos;")})'>
      <div class="card-img-wrap">
        <img src="${cover}" alt="${m.name}" loading="lazy">
        <div class="card-tag">${imgCount} 图${m.video_url ? ' · 视频' : ''}</div>
      </div>
      <div class="card-body">
        <h3>${m.name}</h3>
        <div class="price">¥${m.price} <span>/ 天</span></div>
        <div class="desc">${m.description || '暂无介绍'}</div>
      </div>
    </div>`;
  }).join('');
}

window.openModal = function(m) {
  currentId = m.id;
  currentImages = m.image_urls && m.image_urls.length ? m.image_urls : (m.image_url ? [m.image_url] : []);
  currentVideo = m.video_url;
  slideIndex = 0;

  document.getElementById('modal-name').textContent = m.name;
  document.getElementById('modal-price').innerHTML = '¥' + m.price + ' <span>/ 天</span>';
  document.getElementById('modal-desc').textContent = m.description || '暂无介绍';

  renderMedia();

  // 重置状态：显示「立即租赁」按钮，隐藏表单和成功框
  document.getElementById('form').style.display = 'none';
  document.getElementById('formArea').style.display = 'block';
  document.getElementById('successBox').style.display = 'none';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('msg').className = 'msg';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '提交申请';

  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
};

function renderMedia() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  if (total === 0) {
    document.getElementById('modal-media').innerHTML = '<img src="https://via.placeholder.com/800x500?text=No+Image">';
    return;
  }

  let content = '';
  if (currentVideo && slideIndex === total - 1) {
    content = `<video src="${currentVideo}" controls autoplay></video>`;
  } else {
    content = `<img src="${currentImages[slideIndex]}">`;
  }

  let nav = '';
  if (total > 1) {
    nav = `<div class="carousel-nav">${Array.from({length: total}).map((_, i) =>
      `<span class="${i === slideIndex ? 'active' : ''}" onclick="goSlide(${i})"></span>`).join('')}</div>`;
  }

  let arrows = '';
  if (total > 1) {
    arrows = `<div class="arrow left" onclick="prevSlide()">‹</div>
              <div class="arrow right" onclick="nextSlide()">›</div>`;
  }

  document.getElementById('modal-media').innerHTML = `<div class="carousel">${content}${nav}${arrows}</div>`;
}

window.goSlide = function(i) { slideIndex = i; renderMedia(); };
window.prevSlide = function() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  slideIndex = (slideIndex - 1 + total) % total;
  renderMedia();
};
window.nextSlide = function() {
  const total = currentImages.length + (currentVideo ? 1 : 0);
  slideIndex = (slideIndex + 1) % total;
  renderMedia();
};

window.closeModal = function() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal-media').innerHTML = '';
  document.body.style.overflow = '';
};

window.showForm = function() {
  document.getElementById('form').style.display = 'block';
  document.getElementById('form').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.submitBooking = async function() {
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const name = document.getElementById('cname').value.trim();
  const phone = document.getElementById('cphone').value.trim();

  if (!name || !phone) { msg.className = 'msg err'; msg.textContent = '姓名和手机号必填'; return; }

  btn.disabled = true;
  btn.textContent = '提交中...';
  msg.className = 'msg'; msg.style.display = 'none';

  const { error } = await supabase.from('bookings').insert({
    motorcycle_id: currentId,
    customer_name: name,
    phone: phone,
    id_card: document.getElementById('cid').value.trim(),
    start_date: document.getElementById('cstart').value || null,
    end_date: document.getElementById('cend').value || null,
    note: document.getElementById('cnote').value.trim()
  });

  if (error) {
    msg.className = 'msg err'; msg.textContent = '提交失败：' + error.message;
    btn.disabled = false;
    btn.textContent = '提交申请';
  } else {
    // 整个表单区域隐藏（包括「立即租赁」按钮和表单）
    document.getElementById('formArea').style.display = 'none';
    // 显示成功框
    document.getElementById('successBox').style.display = 'block';
    // 滚动到成功提示位置
    document.getElementById('successBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
};

loadMotorcycles();
</script>
</body>
</html>
